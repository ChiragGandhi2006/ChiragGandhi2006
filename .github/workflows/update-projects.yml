name: Update Project Showcase

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-projects:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile
        uses: actions/checkout@v4

      - name: Update public repositories in README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ChiragGandhi2006
        run: |
          python - <<'PY'
          import json, os, re, urllib.request
          from datetime import datetime

          username = os.environ["GITHUB_USERNAME"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "profile-project-updater",
          }

          repos = []
          for page in range(1, 10):
              url = f"https://api.github.com/users/{username}/repos?per_page=100&page={page}&type=owner&sort=updated"
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as response:
                  batch = json.load(response)
              if not batch:
                  break
              repos.extend(batch)

          excluded = {username.lower()}
          public_repos = [
              r for r in repos
              if not r.get("private")
              and not r.get("fork")
              and r["name"].lower() not in excluded
          ]

          public_repos.sort(key=lambda r: r.get("pushed_at") or r.get("updated_at") or "", reverse=True)

          def clean(text):
              return (text or "No description yet.").replace("|", "\\|").replace("\n", " ").strip()

          rows = []
          for repo in public_repos:
              name = repo["name"]
              pretty = re.sub(r"[-_]+", " ", name).strip().title()
              url = repo["html_url"]
              desc = clean(repo.get("description"))
              updated = repo.get("pushed_at") or repo.get("updated_at")
              date = datetime.fromisoformat(updated.replace("Z", "+00:00")).strftime("%d %b %Y") if updated else "—"
              rows.append(f"| [🚀 {pretty}]({url}) | {desc} | {date} |")

          table = "| Project | Description | Updated |\n|---|---|---|\n" + "\n".join(rows)

          path = "README.md"
          with open(path, "r", encoding="utf-8") as f:
              readme = f.read()

          pattern = r"<!-- PROJECTS:START -->.*?<!-- PROJECTS:END -->"
          replacement = "<!-- PROJECTS:START -->\n\n" + table + "\n\n<!-- PROJECTS:END -->"
          new_readme, count = re.subn(pattern, replacement, readme, flags=re.S)

          if count != 1:
              raise SystemExit("Project markers were not found exactly once in README.md")

          if new_readme != readme:
              with open(path, "w", encoding="utf-8") as f:
                  f.write(new_readme)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: update project showcase"
          git push
